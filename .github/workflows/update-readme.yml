name: Update Profile README

on:
  schedule:
    - cron: '0 0 * * *'   # setiap hari 00:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # kita akan pakai PAT untuk push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci || npm install || true

      - name: Generate README
        run: node scripts/generate-profile.js

      - name: Commit & push changes
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GIT_AUTHOR_NAME: "Amirullah Hidayat"
          GIT_AUTHOR_EMAIL: "amirullahhidayat12@gmail.com"
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          if git status --porcelain | grep .; then
            git add README.md
            git commit -m "chore: update profile README [ci skip]"
            git push "https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git" HEAD:$(git rev-parse --abbrev-ref HEAD)
          else
            echo "No changes to commit"
          fi
