name: Update Profile README

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'   # setiap hari 00:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate README
        run: node scripts/generate-profile.js

      - name: Commit & push changes
        env:
          GIT_AUTHOR_NAME: "Amirullah Hidayat"
          GIT_AUTHOR_EMAIL: "amirullahhidayat12@gmail.com"
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "chore: update profile README [ci skip]"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "No changes to commit"
          fi
